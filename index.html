<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mein Bücherregal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="home-header">
      <h1>Mein Bücherregal</h1>
      <p>Deine persönliche Bibliothek</p>
    </header>

    <a href="regal.html" class="home-button">
      <section class="main-card">
        <h2>📚 Bücherregal</h2>
        <p>Öffne dein virtuelles Regal</p>
      </section>
    </a>

    <div class="small-cards">

      <a href="bibliothek.html" class="home-button">
        <section class="small-card">
          <h3>Bibliothek</h3>
          <p>Alle Bücher ansehen</p>
        </section>
      </a>

      <a href="buch-hinzufuegen.html" class="home-button">
        <section class="small-card">
          <h3>+ Buch</h3>
          <p>Neues Buch hinzufügen</p>
        </section>
      </a>

    </div>

    <section class="section">
      <h2>Deine Bibliothek</h2>

      <div class="stats">

        <div class="stat">
          <strong id="totalBooks">0</strong>
          <span>Bücher</span>
        </div>

        <div class="stat">
          <strong id="readBooks">0</strong>
          <span>Gelesen</span>
        </div>

        <div class="stat">
          <strong id="currentBooks">0</strong>
          <span>Aktuell</span>
        </div>

      </div>
    </section>

    <section class="section">
      <h2>Zuletzt hinzugefügt</h2>

      <div class="empty" id="recentBooks">
        Noch keine Bücher in deiner Sammlung
      </div>
    </section>

  </main>


  <script>

    function openDatabase() {
      return new Promise((resolve, reject) => {

        const request =
          indexedDB.open("buecherregalDB", 1);

        request.onupgradeneeded = function(event) {

          const db = event.target.result;

          if (!db.objectStoreNames.contains("books")) {
            db.createObjectStore("books", {
              keyPath: "id"
            });
          }

        };

        request.onsuccess = function(event) {
          resolve(event.target.result);
        };

        request.onerror = function() {
          reject(new Error(
            "Datenbank konnte nicht geöffnet werden."
          ));
        };

      });
    }


    async function loadHomeData() {

      try {

        const db = await openDatabase();

        const transaction =
          db.transaction("books", "readonly");

        const store =
          transaction.objectStore("books");

        const request =
          store.getAll();


        request.onsuccess = function() {

          const books = request.result;

          document.getElementById("totalBooks")
            .textContent = books.length;

          document.getElementById("readBooks")
            .textContent =
            books.filter(
              book => book.status === "Gelesen"
            ).length;

          document.getElementById("currentBooks")
            .textContent =
            books.filter(
              book => book.status === "Lese ich gerade"
            ).length;


          const recent =
            [...books]
              .sort((a, b) =>
                new Date(b.createdAt || 0) -
                new Date(a.createdAt || 0)
              )
              .slice(0, 3);


          const container =
            document.getElementById("recentBooks");


          if (recent.length === 0) {

            container.textContent =
              "Noch keine Bücher in deiner Sammlung";

            return;
          }


          container.innerHTML = "";


          recent.forEach(book => {

            const item =
              document.createElement("div");

            item.style.marginBottom = "10px";

            const title =
              document.createElement("strong");

            title.textContent = book.title;


            const author =
              document.createElement("div");

            author.style.fontSize = "13px";
            author.style.marginTop = "2px";
            author.style.color = "#806f62";
            author.textContent = book.author;


            item.appendChild(title);
            item.appendChild(author);

            container.appendChild(item);

          });

        };


      } catch (error) {

        console.error(error);

      }

    }


    loadHomeData();

  </script>

</body>
</html>
