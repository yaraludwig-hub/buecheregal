<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Bücherregal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6efe6;
      color: #3d3028;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 700;
    }

    .header p {
      margin-top: 8px;
      color: #806f62;
      font-size: 16px;
    }

    .main-card {
      background: #d9b99b;
      border-radius: 24px;
      padding: 28px 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 22px rgba(76, 52, 37, 0.12);
    }

    .main-card h2 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .main-card p {
      margin: 0;
      color: #5f493a;
    }

    .small-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 30px;
    }

    .card {
      background: #fffaf4;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: #8b796c;
      font-size: 14px;
    }

    .section {
      margin-top: 26px;
    }

    .section h2 {
      font-family: Georgia, serif;
      font-size: 22px;
      margin-bottom: 14px;
    }

    .stats {
      background: #fffaf4;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      text-align: center;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    .stat span {
      font-size: 12px;
      color: #8b796c;
    }

    .empty {
      background: #fffaf4;
      border-radius: 20px;
      padding: 24px;
      color: #8b796c;
      text-align: center;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }

    button {
      width: 100%;
      border: none;
      background: none;
      padding: 0;
      text-align: left;
      color: inherit;
      font: inherit;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <h1>Mein Bücherregal</h1>
      <p>Deine persönliche Bibliothek</p>
    </header>

    <button>
      <section class="main-card">
        <h2>📚 Bücherregal</h2>
        <p>Öffne dein virtuelles Regal</p>
      </section>
    </button>

    <div class="small-cards">
      <button>
        <section class="card">
          <h3>Bibliothek</h3>
          <p>Alle Bücher ansehen</p>
        </section>
      </button>

      <button>
        <section class="card">
          <h3>+ Buch</h3>
          <p>Neues Buch hinzufügen</p>
        </section>
      </button>
    </div>

    <section class="section">
      <h2>Deine Bibliothek</h2>

      <div class="stats">
        <div class="stat">
          <strong>0</strong>
          <span>Bücher</span>
        </div>

        <div class="stat">
          <strong>0</strong>
          <span>Gelesen</span>
        </div>

        <div class="stat">
          <strong>0</strong>
          <span>Aktuell</span>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Zuletzt hinzugefügt</h2>

      <div class="empty">
        Noch keine Bücher in deiner Sammlung
      </div>
    </section>

  </main>
</body>
</html>
