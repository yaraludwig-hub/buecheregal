<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bibliothek</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6efe6;
      color: #3d3028;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #6f5544;
      text-decoration: none;
      font-size: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #806f62;
    }

    .book-list {
      display: grid;
      gap: 14px;
    }

    .book-card {
      background: #fffaf4;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }

    .book-title {
      margin: 0 0 5px;
      font-size: 20px;
      font-weight: 700;
    }

    .book-author {
      margin: 0 0 12px;
      color: #806f62;
    }

    .book-info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #ead9c8;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      color: #5f493a;
    }

    .empty {
      background: #fffaf4;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      color: #8b796c;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }
  </style>
</head>

<body>
  <main class="app">

    <a class="back" href="index.html">← Zurück zur Startseite</a>

    <h1>Bibliothek</h1>
    <p class="subtitle">Alle Bücher aus deiner Sammlung</p>

    <div class="book-list" id="bookList">
      <div class="empty">
        Bibliothek wird geladen …
      </div>
    </div>

  </main>
</body>
</html>
