<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bibliothek</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6efe6;
      color: #3d3028;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 20px 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #6f5544;
      text-decoration: none;
      font-size: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #806f62;
    }

    .controls {
      background: #fffaf4;
      border-radius: 22px;
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }

    .search {
      width: 100%;
      border: 1px solid #dfd0c3;
      border-radius: 14px;
      padding: 13px 14px;
      background: white;
      color: #3d3028;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .controls select {
      width: 100%;
      border: 1px solid #dfd0c3;
      border-radius: 14px;
      padding: 12px 10px;
      background: white;
      color: #3d3028;
    }

    .sort {
      margin-top: 10px;
    }

    .count {
      margin: 0 0 12px;
      color: #806f62;
      font-size: 14px;
    }

    .book-list {
      display: grid;
      gap: 14px;
    }

    .book-card {
      width: 100%;
      border: none;
      text-align: left;
      display: flex;
      gap: 15px;
      background: #fffaf4;
      border-radius: 20px;
      padding: 16px;
      color: inherit;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
      cursor: pointer;
    }

    .book-card:active {
      transform: scale(0.985);
    }

    .cover {
      width: 75px;
      height: 110px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 8px;
      background: #ead9c8;
      box-shadow: 0 3px 8px rgba(61, 48, 40, 0.15);
    }

    .cover-placeholder {
      width: 75px;
      height: 110px;
      flex-shrink: 0;
      border-radius: 8px;
      background: #ead9c8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .book-content {
      flex: 1;
      min-width: 0;
    }

    .book-title {
      margin: 0 0 5px;
      font-size: 19px;
      font-weight: 700;
    }

    .book-author {
      margin: 0 0 9px;
      color: #806f62;
      font-size: 15px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }

    .stars-display {
      display: flex;
      gap: 1px;
    }

    .display-star {
      position: relative;
      display: inline-block;
      width: 18px;
      height: 19px;
      font-size: 18px;
      line-height: 19px;
      color: #d8c8bb;
    }

    .display-star::before {
      content: "★";
    }

    .display-star.full {
      color: #b88f6d;
    }

    .display-star.half::after {
      content: "★";
      position: absolute;
      left: 0;
      top: 0;
      width: 50%;
      overflow: hidden;
      color: #b88f6d;
      white-space: nowrap;
    }

    .rating-number {
      color: #948275;
      font-size: 12px;
    }

    .book-info {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #ead9c8;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      color: #5f493a;
    }

    .empty {
      background: #fffaf4;
      border-radius: 20px;
      padding: 26px;
      text-align: center;
      color: #8b796c;
      box-shadow: 0 6px 18px rgba(76, 52, 37, 0.08);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 24, 0.42);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      background: #f6efe6;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px 40px;
    }

    .modal-handle {
      width: 45px;
      height: 5px;
      border-radius: 999px;
      background: #cab9ab;
      margin: 0 auto 20px;
    }

    .modal-top {
      display: flex;
      gap: 18px;
      margin-bottom: 18px;
    }

    .detail-cover {
      width: 105px;
      height: 155px;
      object-fit: cover;
      flex-shrink: 0;
      border-radius: 10px;
      background: #ead9c8;
      box-shadow: 0 4px 12px rgba(61, 48, 40, 0.18);
    }

    .detail-placeholder {
      width: 105px;
      height: 155px;
      flex-shrink: 0;
      border-radius: 10px;
      background: #ead9c8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .detail-title {
      margin: 4px 0 6px;
      font-family: Georgia, serif;
      font-size: 25px;
    }

    .detail-author {
      margin: 0 0 12px;
      color: #806f62;
    }

    .notes-box {
      background: #fffaf4;
      border-radius: 18px;
      padding: 16px;
      margin: 18px 0;
    }

    .notes-box h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .notes-box p {
      margin: 0;
      white-space: pre-wrap;
      color: #665448;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .action-button {
      border: none;
      border-radius: 15px;
      padding: 14px;
      font-weight: 700;
    }

    .edit-button {
      background: #b88f6d;
      color: white;
    }

    .close-button {
      background: #e8d9cc;
      color: #5f493a;
    }

    .delete-button {
      grid-column: 1 / -1;
      background: transparent;
      color: #a24d46;
      border: 1px solid #d7aaa5;
      margin-top: 4px;
    }

    .edit-form {
      display: none;
      margin-top: 20px;
      background: #fffaf4;
      border-radius: 22px;
      padding: 18px;
    }

    .edit-form.open {
      display: block;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #dfd0c3;
      border-radius: 13px;
      padding: 12px;
      background: white;
      color: #3d3028;
      font-size: 16px;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .edit-rating {
      display: flex;
      gap: 3px;
      margin-top: 5px;
    }

    .edit-star {
      position: relative;
      width: 34px;
      height: 36px;
      border: none;
      background: transparent;
      padding: 0;
      font-size: 34px;
      line-height: 36px;
      color: #d8c8bb;
      cursor: pointer;
    }

    .edit-star::before {
      content: "★";
    }

    .edit-star.full {
      color: #b88f6d;
    }

    .edit-star.half::after {
      content: "★";
      position: absolute;
      left: 0;
      top: 0;
      width: 50%;
      overflow: hidden;
      color: #b88f6d;
      white-space: nowrap;
    }

    .edit-rating-text {
      margin-top: 6px;
      color: #948275;
      font-size: 13px;
    }

    .clear-rating {
      margin-top: 8px;
      border: none;
      background: transparent;
      color: #806f62;
      padding: 0;
      text-decoration: underline;
    }

    .save-edit {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      background: #b88f6d;
      color: white;
      font-weight: 700;
    }

    @media (max-width: 390px) {
      .filters,
      .edit-grid {
        grid-template-columns: 1fr;
      }

      .modal-top {
        gap: 14px;
      }

      .detail-cover,
      .detail-placeholder {
        width: 90px;
        height: 135px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <a class="back" href="index.html">
      ← Zurück zur Startseite
    </a>

    <h1>Bibliothek</h1>
    <p class="subtitle">Alle Bücher aus deiner Sammlung</p>

    <section class="controls">

      <input
        class="search"
        id="searchInput"
        type="search"
        placeholder="Titel, Autor oder Reihe suchen …"
      >

      <div class="filters">

        <select id="statusFilter">
          <option value="">Alle Lesestatus</option>
          <option value="Ungelesen">Ungelesen</option>
          <option value="Lese ich gerade">Lese ich gerade</option>
          <option value="Gelesen">Gelesen</option>
          <option value="Abgebrochen">Abgebrochen</option>
        </select>

        <select id="languageFilter">
          <option value="">Alle Sprachen</option>
          <option value="Deutsch">Deutsch</option>
          <option value="Englisch">Englisch</option>
        </select>

      </div>

      <div class="sort">
        <select id="sortSelect">
          <option value="newest">Zuletzt hinzugefügt</option>
          <option value="title">Titel A–Z</option>
          <option value="author">Autor A–Z</option>
          <option value="rating">Höchste Bewertung</option>
          <option value="series">Reihe</option>
        </select>
      </div>

    </section>

    <p class="count" id="bookCount"></p>

    <div class="book-list" id="bookList">
      <div class="empty">Bibliothek wird geladen …</div>
    </div>

  </main>


  <div class="modal" id="detailModal">

    <div class="modal-content">

      <div class="modal-handle"></div>

      <div class="modal-top" id="modalTop"></div>

      <div class="book-info" id="modalTags"></div>

      <div class="notes-box" id="notesBox">
        <h3>Persönliche Notizen</h3>
        <p id="detailNotes"></p>
      </div>

      <div class="modal-buttons">

        <button class="action-button edit-button" id="editButton">
          Bearbeiten
        </button>

        <button class="action-button close-button" id="closeButton">
          Schließen
        </button>

        <button class="action-button delete-button" id="deleteButton">
          Buch löschen
        </button>

      </div>


      <form class="edit-form" id="editForm">

        <div class="field">
          <label for="editTitle">Titel</label>
          <input id="editTitle" type="text">
        </div>

        <div class="field">
          <label for="editAuthor">Autor/in</label>
          <input id="editAuthor" type="text">
        </div>

        <div class="edit-grid">

          <div class="field">
            <label for="editLanguage">Sprache</label>
            <select id="editLanguage">
              <option>Deutsch</option>
              <option>Englisch</option>
            </select>
          </div>

          <div class="field">
            <label for="editPages">Seiten</label>
            <input id="editPages" type="number">
          </div>

        </div>

        <div class="field">
          <label for="editStatus">Lesestatus</label>
          <select id="editStatus">
            <option>Ungelesen</option>
            <option>Lese ich gerade</option>
            <option>Gelesen</option>
            <option>Abgebrochen</option>
          </select>
        </div>

        <div class="field">
          <label>Bewertung</label>

          <div class="edit-rating" id="editRatingStars">
            <button type="button" class="edit-star" data-value="1"></button>
            <button type="button" class="edit-star" data-value="2"></button>
            <button type="button" class="edit-star" data-value="3"></button>
            <button type="button" class="edit-star" data-value="4"></button>
            <button type="button" class="edit-star" data-value="5"></button>
          </div>

          <div class="edit-rating-text" id="editRatingText">
            Keine Bewertung
          </div>

          <button type="button" class="clear-rating" id="clearRating">
            Bewertung entfernen
          </button>

          <input type="hidden" id="editRating" value="">
        </div>

        <div class="field">
          <label for="editFormat">Format / Quelle</label>

          <select id="editFormat">
            <option>Print</option>
            <option>Kindle</option>
            <option>Kindle Unlimited</option>
            <option>Hörbuch</option>
          </select>
        </div>

        <div class="edit-grid">

          <div class="field">
            <label for="editSeries">Reihe</label>
            <input id="editSeries" type="text">
          </div>

          <div class="field">
            <label for="editVolume">Band</label>
            <input id="editVolume" type="number">
          </div>

        </div>

                <div class="field">
          <label for="editCover">Cover-URL</label>
          <input id="editCover" type="url">
        </div>

        <div class="field">
          <label for="editSpineImageUrl">Buchrücken-URL</label>
          <input
            id="editSpineImageUrl"
            type="url"
            placeholder="https://..."
          >
        </div>

        <div class="field">
          <label for="editNotes">Persönliche Notizen</label>
          <textarea id="editNotes"></textarea>
        </div>

        <button class="save-edit" type="submit">
          Änderungen speichern
        </button>

      </form>

    </div>

  </div>


  <script>

    let allBooks = [];
    let selectedBook = null;
    let editRating = 0;

    const editStars =
      document.querySelectorAll(".edit-star");


    function openDatabase() {

      return new Promise((resolve, reject) => {

        const request =
          indexedDB.open("buecherregalDB", 1);

        request.onupgradeneeded = function(event) {

          const db = event.target.result;

          if (!db.objectStoreNames.contains("books")) {

            db.createObjectStore("books", {
              keyPath: "id"
            });

          }

        };

        request.onsuccess = function(event) {
          resolve(event.target.result);
        };

        request.onerror = function() {
          reject(new Error(
            "Datenbank konnte nicht geöffnet werden."
          ));
        };

      });

    }


    async function loadBooks() {

      try {

        const db = await openDatabase();

        const transaction =
          db.transaction("books", "readonly");

        const store =
          transaction.objectStore("books");

        const request =
          store.getAll();


        request.onsuccess = function() {

          allBooks = request.result;

          displayBooks();

        };


        request.onerror = function() {
          showError();
        };


      } catch (error) {

        console.error(error);

        showError();

      }

    }


    function displayBooks() {

      const bookList =
        document.getElementById("bookList");

      const search =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      const status =
        document.getElementById("statusFilter").value;

      const language =
        document.getElementById("languageFilter").value;

      const sort =
        document.getElementById("sortSelect").value;


      let books = allBooks.filter((book) => {

        const searchableText = [
          book.title,
          book.author,
          book.series
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return (
          searchableText.includes(search) &&
          (!status || book.status === status) &&
          (!language || book.language === language)
        );

      });


      if (sort === "newest") {

        books.sort((a, b) =>
          new Date(b.createdAt || 0) -
          new Date(a.createdAt || 0)
        );

      }


      if (sort === "title") {

        books.sort((a, b) =>
          (a.title || "").localeCompare(
            b.title || "",
            "de",
            { sensitivity: "base" }
          )
        );

      }


      if (sort === "author") {

        books.sort((a, b) =>
          (a.author || "").localeCompare(
            b.author || "",
            "de",
            { sensitivity: "base" }
          )
        );

      }


      if (sort === "rating") {

        books.sort((a, b) =>
          (b.rating || 0) - (a.rating || 0)
        );

      }


      if (sort === "series") {

        books.sort((a, b) => {

          const seriesA =
            a.series || "ZZZZZZ";

          const seriesB =
            b.series || "ZZZZZZ";

          const comparison =
            seriesA.localeCompare(
              seriesB,
              "de",
              { sensitivity: "base" }
            );

          if (comparison !== 0) {
            return comparison;
          }

          return (
            (a.volume || 999) -
            (b.volume || 999)
          );

        });

      }


      document
        .getElementById("bookCount")
        .textContent =
        books.length === 1
          ? "1 Buch"
          : books.length + " Bücher";


      bookList.innerHTML = "";


      if (books.length === 0) {

        bookList.innerHTML = `
          <div class="empty">
            Keine passenden Bücher gefunden.
          </div>
        `;

        return;

      }


      books.forEach((book) => {

        const card =
          document.createElement("button");

        card.type = "button";
        card.className = "book-card";


        const cover =
          createCover(
            book,
            "cover",
            "cover-placeholder"
          );


        const content =
          document.createElement("div");

        content.className = "book-content";


        const title =
          document.createElement("h2");

        title.className = "book-title";
        title.textContent = book.title;


        const author =
          document.createElement("p");

        author.className = "book-author";
        author.textContent = book.author;


        content.appendChild(title);
        content.appendChild(author);


        if (book.rating) {

          content.appendChild(
            createRating(book.rating)
          );

        }


        const info =
          document.createElement("div");

        info.className = "book-info";


        addTag(info, book.status);
        addTag(info, book.language);
        addTag(info, book.format);


        if (book.series) {

          let text = book.series;

          if (book.volume) {
            text += " · Band " + book.volume;
          }

          addTag(info, text);

        }


        content.appendChild(info);

        card.appendChild(cover);
        card.appendChild(content);


        card.addEventListener("click", function() {
          openDetails(book);
        });


        bookList.appendChild(card);

      });

    }


    function createCover(
      book,
      imageClass,
      placeholderClass
    ) {

      if (book.cover) {

        const image =
          document.createElement("img");

        image.className = imageClass;
        image.src = book.cover;
        image.alt = "Cover von " + book.title;


        image.onerror = function() {

          const placeholder =
            createPlaceholder(placeholderClass);

          image.replaceWith(placeholder);

        };


        return image;

      }


      return createPlaceholder(placeholderClass);

    }


    function createPlaceholder(className) {

      const placeholder =
        document.createElement("div");

      placeholder.className = className;
      placeholder.textContent = "📖";

      return placeholder;

    }


    function createRating(rating) {

      const wrapper =
        document.createElement("div");

      wrapper.className = "rating-row";


      const stars =
        document.createElement("span");

      stars.className = "stars-display";


      for (let i = 1; i <= 5; i++) {

        const star =
          document.createElement("span");

        star.className = "display-star";


        if (rating >= i) {

          star.classList.add("full");

        } else if (rating >= i - 0.5) {

          star.classList.add("half");

        }


        stars.appendChild(star);

      }


      const number =
        document.createElement("span");

      number.className = "rating-number";
      number.textContent = rating + " / 5";


      wrapper.appendChild(stars);
      wrapper.appendChild(number);


      return wrapper;

    }


    function addTag(container, text) {

      if (!text) {
        return;
      }

      const tag =
        document.createElement("span");

      tag.className = "tag";
      tag.textContent = text;

      container.appendChild(tag);

    }


    function openDetails(book) {

      selectedBook = book;


      const modal =
        document.getElementById("detailModal");

      const top =
        document.getElementById("modalTop");

      const tags =
        document.getElementById("modalTags");

      const notes =
        document.getElementById("detailNotes");

      const notesBox =
        document.getElementById("notesBox");


      top.innerHTML = "";
      tags.innerHTML = "";


      const cover =
        createCover(
          book,
          "detail-cover",
          "detail-placeholder"
        );


      const text =
        document.createElement("div");


      const title =
        document.createElement("h2");

      title.className = "detail-title";
      title.textContent = book.title;


      const author =
        document.createElement("p");

      author.className = "detail-author";
      author.textContent = book.author;


      text.appendChild(title);
      text.appendChild(author);


      if (book.rating) {

        text.appendChild(
          createRating(book.rating)
        );

      }


      top.appendChild(cover);
      top.appendChild(text);


      addTag(tags, book.status);
      addTag(tags, book.language);
      addTag(tags, book.format);


      if (book.pages) {
        addTag(tags, book.pages + " Seiten");
      }


      if (book.series) {

        let seriesText = book.series;

        if (book.volume) {
          seriesText += " · Band " + book.volume;
        }

        addTag(tags, seriesText);

      }


      if (book.notes) {

        notesBox.style.display = "block";
        notes.textContent = book.notes;

      } else {

        notesBox.style.display = "none";

      }


      document
        .getElementById("editForm")
        .classList
        .remove("open");


      modal.classList.add("open");

    }


    function closeDetails() {

      document
        .getElementById("detailModal")
        .classList
        .remove("open");

      selectedBook = null;

    }


    document
      .getElementById("closeButton")
      .addEventListener("click", closeDetails);


    document
      .getElementById("detailModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closeDetails();
        }

      });


    document
      .getElementById("editButton")
      .addEventListener("click", function() {

        if (!selectedBook) {
          return;
        }


        document.getElementById("editTitle").value =
          selectedBook.title || "";

        document.getElementById("editAuthor").value =
          selectedBook.author || "";

        document.getElementById("editLanguage").value =
          selectedBook.language || "Deutsch";

        document.getElementById("editPages").value =
          selectedBook.pages || "";

        document.getElementById("editStatus").value =
          selectedBook.status || "Ungelesen";

        document.getElementById("editFormat").value =
          selectedBook.format || "Print";

        document.getElementById("editSeries").value =
          selectedBook.series || "";

        document.getElementById("editVolume").value =
          selectedBook.volume || "";

        document.getElementById("editCover").value =
          selectedBook.cover || "";

        document.getElementById("editNotes").value =
          selectedBook.notes || "";


        editRating =
          Number(selectedBook.rating) || 0;

        updateEditStars();


        document
          .getElementById("editForm")
          .classList
          .toggle("open");

      });


    editStars.forEach((star) => {

      star.addEventListener("click", function(event) {

        const rect =
          star.getBoundingClientRect();

        const clickPosition =
          event.clientX - rect.left;

        const starValue =
          Number(star.dataset.value);


        if (clickPosition < rect.width / 2) {

          editRating =
            starValue - 0.5;

        } else {

          editRating =
            starValue;

        }


        updateEditStars();

      });

    });


    function updateEditStars() {

      document.getElementById("editRating").value =
        editRating || "";


      document.getElementById("editRatingText")
        .textContent =
        editRating
          ? editRating + " von 5 Sternen"
          : "Keine Bewertung";


      editStars.forEach((star) => {

        const value =
          Number(star.dataset.value);


        star.classList.remove(
          "full",
          "half"
        );


        if (editRating >= value) {

          star.classList.add("full");

        } else if (
          editRating === value - 0.5
        ) {

          star.classList.add("half");

        }

      });

    }


    document
      .getElementById("clearRating")
      .addEventListener("click", function() {

        editRating = 0;
        updateEditStars();

      });


    document
      .getElementById("editForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        if (!selectedBook) {
          return;
        }


        const title =
          document
            .getElementById("editTitle")
            .value
            .trim();

        const author =
          document
            .getElementById("editAuthor")
            .value
            .trim();


        if (!title || !author) {

          alert(
            "Titel und Autor/in dürfen nicht leer sein."
          );

          return;

        }


        const updatedBook = {

          ...selectedBook,

          title: title,

          author: author,

          language:
            document.getElementById(
              "editLanguage"
            ).value,

          pages:
            Number(
              document.getElementById(
                "editPages"
              ).value
            ) || null,

          status:
            document.getElementById(
              "editStatus"
            ).value,

          rating:
            editRating || null,

          format:
            document.getElementById(
              "editFormat"
            ).value,

          series:
            document
              .getElementById("editSeries")
              .value
              .trim(),

          volume:
            Number(
              document.getElementById(
                "editVolume"
              ).value
            ) || null,

          cover:
            document
              .getElementById("editCover")
              .value
              .trim(),

          notes:
            document
              .getElementById("editNotes")
              .value
              .trim(),

          updatedAt:
            new Date().toISOString()

        };


        try {

          const db = await openDatabase();

          const transaction =
            db.transaction(
              "books",
              "readwrite"
            );

          const store =
            transaction.objectStore("books");

          store.put(updatedBook);


          transaction.oncomplete =
            function() {

              selectedBook = updatedBook;

              loadBooks();
              openDetails(updatedBook);

              alert(
                "Änderungen wurden gespeichert."
              );

            };


        } catch (error) {

          console.error(error);

          alert(
            "Die Änderungen konnten nicht gespeichert werden."
          );

        }

      });


    document
      .getElementById("deleteButton")
      .addEventListener("click", async function() {

        if (!selectedBook) {
          return;
        }


        const confirmed = confirm(
          "Möchtest du „" +
          selectedBook.title +
          "“ wirklich aus deiner Bibliothek löschen?"
        );


        if (!confirmed) {
          return;
        }


        try {

          const id =
            selectedBook.id;

          const db =
            await openDatabase();

          const transaction =
            db.transaction(
              "books",
              "readwrite"
            );

          const store =
            transaction.objectStore("books");

          store.delete(id);


          transaction.oncomplete =
            function() {

              closeDetails();
              loadBooks();

            };


        } catch (error) {

          console.error(error);

          alert(
            "Das Buch konnte nicht gelöscht werden."
          );

        }

      });


    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        displayBooks
      );


    document
      .getElementById("statusFilter")
      .addEventListener(
        "change",
        displayBooks
      );


    document
      .getElementById("languageFilter")
      .addEventListener(
        "change",
        displayBooks
      );


    document
      .getElementById("sortSelect")
      .addEventListener(
        "change",
        displayBooks
      );


    function showError() {

      document
        .getElementById("bookList")
        .innerHTML = `
          <div class="empty">
            Die Bibliothek konnte nicht geladen werden.
          </div>
        `;

    }


    loadBooks();

  </script>

</body>
</html>
