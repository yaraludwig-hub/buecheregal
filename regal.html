<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f6efe6"
  >

  <title>Mein Bücherregal</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================================================
       GRUNDLAYOUT
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      overscroll-behavior-y: none;
    }

    .shelf-page {
      width: 100%;
      max-width: 1250px;
      margin: 0 auto;

      padding:
        18px
        16px
        50px;
    }

    .shelf-header {
      margin-bottom: 18px;
    }

    .shelf-header h1 {
      margin-bottom: 6px;
    }

    .shelf-header p {
      margin-top: 0;

      color: #75675f;
    }


    /* =========================================================
       WERKZEUGLEISTE
       ========================================================= */

    .shelf-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      align-items: center;

      margin-bottom: 18px;

      padding: 14px;

      background: #fffaf4;

      border-radius: 16px;

      box-shadow:
        0 7px 20px
        rgba(70, 45, 30, 0.08);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      align-items: center;
    }

    .toolbar-group + .toolbar-group {
      margin-left: auto;
    }

    .toolbar-button,
    .toolbar-select {
      min-height: 42px;

      border: 1px solid #d8c8b8;

      border-radius: 11px;

      padding:
        9px
        13px;

      background: #fff;

      color: #3d3028;

      font: inherit;
    }

    .toolbar-button {
      cursor: pointer;

      text-decoration: none;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      font-weight: 600;
    }

    .toolbar-button.primary {
      background: #b88f6d;

      border-color: #b88f6d;

      color: white;
    }

    .toolbar-button.active {
      background: #ead9c8;

      border-color: #b88f6d;
    }

    .toolbar-button:active {
      transform: scale(0.98);
    }


    /* =========================================================
       INFOLEISTE
       ========================================================= */

    .shelf-info {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      margin-bottom: 14px;

      font-size: 14px;

      color: #75675f;
    }

    .info-pill {
      background: #ead9c8;

      border-radius: 999px;

      padding:
        6px
        11px;
    }


    /* =========================================================
       REGAL
       ========================================================= */

    .bookshelf-wrapper {
      position: relative;

      width: 100%;
    }

    .bookshelf {
      position: relative;

      overflow: hidden;

      padding:
        26px
        18px
        34px;

      border:
        12px
        solid
        #69442f;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #86583a 0%,
          #a5714d 12%,
          #8a5a3b 31%,
          #a06b47 52%,
          #8c5b3b 72%,
          #a5704b 88%,
          #805238 100%
        );

      box-shadow:
        0 18px 40px
        rgba(60, 35, 22, 0.28),

        inset
        0
        0
        26px
        rgba(255, 255, 255, 0.08);
    }

    .bookshelf::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      opacity: 0.18;

      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 80px,
          rgba(55, 28, 14, 0.18) 81px,
          transparent 83px
        );
    }


    /* =========================================================
       EINZELNE REGALEBENE
       ========================================================= */

    .shelf-row {
      position: relative;

      min-height: 245px;

      margin-bottom: 34px;

      padding:
        30px
        14px
        22px;

      display: flex;

      align-items: flex-end;

      gap: 4px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(40, 22, 12, 0.15),
          rgba(35, 20, 12, 0.35)
        );

      border-radius:
        7px
        7px
        2px
        2px;

      box-shadow:
        inset
        0
        10px
        18px
        rgba(35, 18, 10, 0.14);
    }

    .shelf-row:last-child {
      margin-bottom: 0;
    }

    .shelf-row::before {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 22px;

      z-index: 20;

      background:
        linear-gradient(
          180deg,
          #aa744f,
          #74492f
        );

      box-shadow:
        0
        8px
        10px
        rgba(40, 20, 10, 0.42);
    }

    .shelf-row::after {
      content: "";

      position: absolute;

      left: 8px;
      right: 8px;
      bottom: 18px;

      height: 3px;

      z-index: 21;

      opacity: 0.4;

      background:
        rgba(255, 255, 255, 0.35);
    }

    .shelf-drop-highlight {
      outline:
        3px
        dashed
        rgba(255, 245, 220, 0.75);

      outline-offset: -8px;
    }


    /* =========================================================
       BUCHRÜCKEN
       ========================================================= */

    .book-spine {
      position: relative;

      z-index: 5;

      flex:
        0
        0
        auto;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius:
  5px
  7px
  3px
  3px;

border-left:
  1px solid
  rgba(255, 255, 255, 0.16);

border-right:
  1px solid
  rgba(0, 0, 0, 0.26);

box-shadow:
  3px
  4px
  7px
  rgba(35, 18, 10, 0.46),

  inset
  4px
  0
  5px
  rgba(255, 255, 255, 0.16),

  inset
  -4px
  0
  5px
  rgba(0, 0, 0, 0.22),

  inset
  0
  2px
  2px
  rgba(255, 255, 255, 0.16),

  inset
  0
  -2px
  3px
  rgba(0, 0, 0, 0.22);

      cursor: grab;

      touch-action: none;

      user-select: none;

      -webkit-user-select: none;

      transform-origin: bottom center;

      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        box-shadow 0.15s ease;
    }

    .book-spine::before {
  content: "";

  position: absolute;

  top: 3px;
  bottom: 3px;
  left: 3px;

  width: 32%;

  z-index: 3;

  pointer-events: none;

  border-radius: 50%;

  opacity: 0.32;

  background:
    linear-gradient(
      90deg,
      rgba(255, 255, 255, 0.34),
      rgba(255, 255, 255, 0.08),
      transparent
    );
}

    .book-spine::after {
  content: "";

  position: absolute;

  top: 0;
  bottom: 0;
  right: 0;

  width: 24%;

  z-index: 3;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0, 0, 0, 0.22)
    );
}
    
    /* =========================================================
       ECHTES BUCHRÜCKENBILD
       ========================================================= */

    .book-spine-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;

      border-radius: inherit;

      z-index: 2;

      pointer-events: none;

      user-select: none;
      -webkit-user-select: none;
    }

    .book-spine.has-real-spine::before,
    .book-spine.has-real-spine::after {
      z-index: 3;
    }
    .book-spine:hover {
      transform:
        translateY(-7px);
    }

    .book-spine:active {
      cursor: grabbing;
    }

    .book-spine.dragging {
      opacity: 0.65;

      transform:
        translateY(-15px)
        scale(1.04);

      filter:
        brightness(1.08);

      box-shadow:
        7px
        10px
        17px
        rgba(35, 18, 10, 0.38);
    }
    /* =========================================================
       REALISTISCHER COVER-BASIERTER BUCHRÜCKEN
       ========================================================= */

    .book-spine-cover-texture {
      position: absolute;
      inset: -8px;

      width: calc(100% + 16px);
      height: calc(100% + 16px);

      object-fit: cover;
      object-position: center;

      filter:
        brightness(0.72)
        saturate(0.9)
        contrast(1.08);

      transform: scale(1.08);

      opacity: 0;

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;

      z-index: 1;
    }

    .book-spine-cover-shade {
      position: absolute;
      inset: 0;

      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.30) 0%,
          rgba(255, 255, 255, 0.12) 18%,
          transparent 42%,
          rgba(0, 0, 0, 0.15) 82%,
          rgba(0, 0, 0, 0.38) 100%
        );
    }

   .book-spine-author {
  position: absolute;

  left: 50%;
  bottom: 8px;

  z-index: 4;

  max-height: 48px;
  max-width: calc(100% - 6px);

  writing-mode: vertical-rl;

  transform:
    translateX(-50%)
    rotate(180deg);

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;

  font-size: 7px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-weight: 600;

  line-height: 1;

  letter-spacing: 0.2px;

  color:
    rgba(
      255,
      255,
      255,
      0.92
    );

  text-shadow:
    0
    1px
    2px
    rgba(
      0,
      0,
      0,
      0.9
    );
}
     .book-spine-title {
  position: absolute;

  top: 10px;
  left: 50%;

  z-index: 4;

  max-height: calc(100% - 76px);
  max-width: calc(100% - 6px);

  writing-mode: vertical-rl;

  transform:
    translateX(-50%)
    rotate(180deg);

  white-space: nowrap;

  overflow: hidden;
  text-overflow: ellipsis;

  font-family:
  "Palatino Linotype",
  Palatino,
  Georgia,
  serif;
       
  font-size: 11px;

  font-weight: 700;

  line-height: 1;

  letter-spacing: 0.15px;

  color:
    rgba(
      255,
      255,
      255,
      0.96
    );

  text-shadow:
    0
    1px
    2px
    rgba(
      0,
      0,
      0,
      0.7
    );
}
    .book-spine.light .book-spine-title {
      color: #3d3028;

      text-shadow:
        0
        1px
        1px
        rgba(255, 255, 255, 0.5);
    }
.book-spine-ornament {
  position: absolute;

  left: 6px;
  right: 6px;

  height: 1px;

  z-index: 4;

  pointer-events: none;

  opacity: 0.72;

  background:
    currentColor;

  box-shadow:
    0
    1px
    1px
    rgba(0, 0, 0, 0.25);
}

.book-spine-ornament.top {
  top: 7px;
}

.book-spine-ornament.bottom {
  bottom: 61px;
}
.book-spine[data-ornament-style="classic"]
.book-spine-ornament {
  left: 6px;
  right: 6px;
}

.book-spine[data-ornament-style="bold"]
.book-spine-ornament {
  left: 5px;
  right: 5px;
  height: 3px;
  background:
    linear-gradient(
      180deg,
      currentColor 0 1px,
      transparent 1px 2px,
      currentColor 2px 3px
    );
}

.book-spine[data-ornament-style="geometric"]
.book-spine-ornament {
  left: 8px;
  right: 8px;
  height: 2px;
  background:
    repeating-linear-gradient(
      90deg,
      currentColor 0 4px,
      transparent 4px 7px
    );
}

.book-spine[data-ornament-style="delicate"]
.book-spine-ornament {
  left: 11px;
  right: 11px;
  height: 1px;
  opacity: 0.42;
  background:
    linear-gradient(
      90deg,
      transparent,
      currentColor 18%,
      currentColor 82%,
      transparent
    );
}

.book-spine[data-ornament-style="dark"]
.book-spine-ornament {
  left: 7px;
  right: 7px;
  height: 1px;
  opacity: 0.82;
  background:
    linear-gradient(
      90deg,
      transparent 0%,
      currentColor 12%,
      currentColor 88%,
      transparent 100%
    );
  box-shadow:
    0 0 2px currentColor;
}

    

   .book-spine-pattern {
  position: absolute;
  top: 18px;
  bottom: 68px;
  left: 4px;
  right: 4px;
  z-index: 2;
  pointer-events: none;

  opacity: 0.18;

  background-repeat:
    no-repeat;

  color:
    currentColor;
}


/* Alte einzelne Mittelmarke ausblenden.
   Die Motive übernimmt ab jetzt
   das neue Pattern-System. */
.book-spine-center-ornament {
  display: none;
}


/* =================================
   MOTIVE
   ================================= */

.book-spine-pattern::before,
.book-spine-pattern::after {
  position: absolute;
  display: block;
  left: 50%;

  transform:
    translateX(-50%);

  line-height: 1;

  text-align: center;

  color:
    currentColor;

  text-shadow:
    0 1px 2px
    rgba(0,0,0,0.32);

  pointer-events: none;
}


/* Motiv 0 – klassische Raute */
.book-spine[data-motif-variant="0"]
.book-spine-pattern::before {
  content: "◆";
}

.book-spine[data-motif-variant="0"]
.book-spine-pattern::after {
  content: "◇";
}


/* Motiv 1 – Sterne */
.book-spine[data-motif-variant="1"]
.book-spine-pattern::before {
  content: "✦";
}

.book-spine[data-motif-variant="1"]
.book-spine-pattern::after {
  content: "⋆";
}


/* Motiv 2 – feine Lichtpunkte */
.book-spine[data-motif-variant="2"]
.book-spine-pattern::before {
  content: "✧";
}

.book-spine[data-motif-variant="2"]
.book-spine-pattern::after {
  content: "•";
}


/* Motiv 3 – Doppelraute */
.book-spine[data-motif-variant="3"]
.book-spine-pattern::before {
  content: "◇";
}

.book-spine[data-motif-variant="3"]
.book-spine-pattern::after {
  content: "◆";
}


/* Motiv 4 – kräftiges Emblem */
.book-spine[data-motif-variant="4"]
.book-spine-pattern::before {
  content: "❖";
}

.book-spine[data-motif-variant="4"]
.book-spine-pattern::after {
  content: "✦";
}


/* Motiv 5 – sehr feine Sterne */
.book-spine[data-motif-variant="5"]
.book-spine-pattern::before {
  content: "⋆";
}

.book-spine[data-motif-variant="5"]
.book-spine-pattern::after {
  content: "✧";
}


/* =================================
   LAYOUTS
   ================================= */


/* Layout 0:
   kleines Motiv oben und unten */
.book-spine[data-layout-variant="0"]
.book-spine-pattern::before {
  top: 10%;
}

.book-spine[data-layout-variant="0"]
.book-spine-pattern::after {
  bottom: 8%;
}


/* Layout 1:
   einzelnes größeres Mittelmotiv */
.book-spine[data-layout-variant="1"]
.book-spine-pattern::before {
  top: 48%;

  transform:
    translate(-50%, -50%);
}

.book-spine[data-layout-variant="1"]
.book-spine-pattern::after {
  display: none;
}


/* Layout 2:
   asymmetrisch */
.book-spine[data-layout-variant="2"]
.book-spine-pattern::before {
  top: 22%;
}

.book-spine[data-layout-variant="2"]
.book-spine-pattern::after {
  bottom: 18%;
}


/* Layout 3:
   Motive näher an den Enden */
.book-spine[data-layout-variant="3"]
.book-spine-pattern::before {
  top: 4%;
}

.book-spine[data-layout-variant="3"]
.book-spine-pattern::after {
  bottom: 4%;
}


/* Layout 4:
   zwei Motive im Mittelbereich */
.book-spine[data-layout-variant="4"]
.book-spine-pattern::before {
  top: 36%;
}

.book-spine[data-layout-variant="4"]
.book-spine-pattern::after {
  bottom: 34%;
}


/* =================================
   LINIEN
   ================================= */


/* Variante 0:
   zwei kurze Zierlinien */
.book-spine[data-line-variant="0"]
.book-spine-pattern {
  background-image:
    linear-gradient(
      90deg,
      transparent,
      currentColor 18%,
      currentColor 82%,
      transparent
    ),
    linear-gradient(
      90deg,
      transparent,
      currentColor 18%,
      currentColor 82%,
      transparent
    );

  background-size:
    22px 1px,
    22px 1px;

  background-position:
    center 17%,
    center 83%;
}


/* Variante 1:
   nur eine feine obere Linie */
.book-spine[data-line-variant="1"]
.book-spine-pattern {
  background-image:
    linear-gradient(
      90deg,
      transparent,
      currentColor 20%,
      currentColor 80%,
      transparent
    );

  background-size:
    25px 1px;

  background-position:
    center 13%;
}


/* Variante 2:
   zwei schmale Seitenlinien */
.book-spine[data-line-variant="2"]
.book-spine-pattern {
  background-image:
    linear-gradient(
      currentColor,
      currentColor
    ),
    linear-gradient(
      currentColor,
      currentColor
    );

  background-size:
    1px 44%,
    1px 44%;

  background-position:
    3px center,
    calc(100% - 3px) center;
}


/* Variante 3:
   kurze Linie unten */
.book-spine[data-line-variant="3"]
.book-spine-pattern {
  background-image:
    linear-gradient(
      90deg,
      transparent,
      currentColor 15%,
      currentColor 85%,
      transparent
    );

  background-size:
    18px 1px;

  background-position:
    center 88%;
}


/* =================================
   DEKORATIONSMENGE
   ================================= */

.book-spine[data-decoration-level="minimal"]
.book-spine-pattern {
  opacity: 0.11;
}

.book-spine[data-decoration-level="minimal"]
.book-spine-pattern::after {
  display: none;
}


.book-spine[data-decoration-level="medium"]
.book-spine-pattern {
  opacity: 0.18;
}


.book-spine[data-decoration-level="rich"]
.book-spine-pattern {
  opacity: 0.26;
}


/* =================================
   GRUNDCHARAKTER
   ================================= */

.book-spine[data-ornament-style="classic"]
.book-spine-pattern::before,
.book-spine[data-ornament-style="classic"]
.book-spine-pattern::after {
  font-size: 7px;
}


.book-spine[data-ornament-style="bold"]
.book-spine-pattern::before,
.book-spine[data-ornament-style="bold"]
.book-spine-pattern::after {
  font-size: 10px;
  font-weight: 700;
}


.book-spine[data-ornament-style="geometric"]
.book-spine-pattern::before,
.book-spine[data-ornament-style="geometric"]
.book-spine-pattern::after {
  font-size: 9px;
}


.book-spine[data-ornament-style="delicate"]
.book-spine-pattern::before,
.book-spine[data-ornament-style="delicate"]
.book-spine-pattern::after {
  font-size: 6px;
  opacity: 0.68;
}


.book-spine[data-ornament-style="dark"]
.book-spine-pattern::before,
.book-spine[data-ornament-style="dark"]
.book-spine-pattern::after {
  font-size: 8px;

  text-shadow:
    0 0 3px
    currentColor;
}  
    
    .book-spine-series {
      position: absolute;

      z-index: 4;

      bottom: 6px;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        rgba(
          255,
          235,
          190,
          0.8
        );

      box-shadow:
        0
        0
        4px
        rgba(255, 235, 190, 0.65);
    }


    /* =========================================================
       COVER-ANSICHT
       ========================================================= */

    .shelf-row.cover-mode {
      align-items: flex-end;

      gap: 12px;
    }

    .cover-book {
      position: relative;

      z-index: 5;

      flex:
        0
        0
        auto;

      width: 105px;

      min-height: 160px;

      cursor: grab;

      touch-action: none;

      user-select: none;

      -webkit-user-select: none;

      transition:
        transform
        0.16s
        ease;
    }

    .cover-book:hover {
      transform:
        translateY(-7px);
    }

    .cover-book.dragging {
      opacity: 0.6;

      transform:
        translateY(-14px)
        scale(1.04);
    }

    .cover-book img {
      display: block;

      width: 100%;
      height: 158px;

      object-fit: cover;

      border-radius:
        4px
        6px
        5px
        4px;

      box-shadow:
        4px
        6px
        10px
        rgba(35, 18, 10, 0.38);
    }

    .cover-placeholder {
      width: 100%;
      height: 158px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 10px;

      text-align: center;

      font-family: Georgia, serif;

      font-size: 13px;

      border-radius: 5px;

      color: white;

      background:
        #75513e;

      box-shadow:
        4px
        6px
        10px
        rgba(35, 18, 10, 0.38);
    }


    /* =========================================================
       LEERES REGAL
       ========================================================= */

    .empty-shelf {
      position: relative;

      z-index: 3;

      width: 100%;

      padding-bottom: 70px;

      text-align: center;

      color:
        rgba(
          255,
          255,
          255,
          0.72
        );

      font-size: 14px;
    }


    /* =========================================================
       DEKORATIONEN
       ========================================================= */

    .decoration-layer {
      position: absolute;

      inset: 0;

      z-index: 12;

      pointer-events: none;
    }

    .decoration {
      position: absolute;

      display: flex;

      align-items: center;
      justify-content: center;

      min-width: 44px;
      min-height: 44px;

      font-size: 42px;

  <script>

    /* =========================================================
       DATENBANK
       ========================================================= */

    const DB_NAME =
      "buecherregalDB";

    const DB_VERSION =
      1;

    const STORE_NAME =
      "books";


    function openDatabase() {

      return new Promise(
        (resolve, reject) => {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );

          request.onupgradeneeded =
            event => {

              const db =
                event.target.result;

              if (
                !db.objectStoreNames.contains(
                  STORE_NAME
                )
              ) {

                db.createObjectStore(
                  STORE_NAME,
                  {
                    keyPath: "id"
                  }
                );

              }

            };


          request.onsuccess =
            () => {

              resolve(
                request.result
              );

            };


          request.onerror =
            () => {

              reject(
                request.error
              );

            };

        }
      );

    }


    async function getAllBooks() {

      const db =
        await openDatabase();


      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              STORE_NAME,
              "readonly"
            );

          const store =
            transaction.objectStore(
              STORE_NAME
            );

          const request =
            store.getAll();


          request.onsuccess =
            () => {

              resolve(
                request.result || []
              );

            };


          request.onerror =
            () => {

              reject(
                request.error
              );

            };

        }
      );

    }


    async function saveBook(
      book
    ) {

      const db =
        await openDatabase();


      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              STORE_NAME,
              "readwrite"
            );

          const store =
            transaction.objectStore(
              STORE_NAME
            );

          store.put(
            book
          );


          transaction.oncomplete =
            () => {

              resolve();

            };


          transaction.onerror =
            () => {

              reject(
                transaction.error
              );

            };

        }
      );

    }


    /* =========================================================
       ZUSTAND
       ========================================================= */

    let books = [];

    let displayedBooks = [];

    let currentView =
      localStorage.getItem(
        "bookshelfView"
      ) || "spine";

    let currentSort =
      localStorage.getItem(
        "bookshelfSort"
      ) || "manual";

    let draggingBookId =
      null;

    let dragStartX =
      0;

    let dragStartY =
      0;

    let movedDuringDrag =
      false;

    let selectedDecorationId =
      null;


    /* =========================================================
       BUCHFARBEN
       ========================================================= */

    const shelfColors = [

      "#713f3f",

      "#355e61",

      "#85653d",

      "#544871",

      "#436b50",

      "#985641",

      "#3e6178",

      "#76533e",

      "#8f7447",

      "#70495c",

      "#41695e",

      "#975d48",

      "#4e5478",

      "#826340",

      "#6d4545",

      "#45636c"

    ];


    function hashString(
      text
    ) {

      let hash = 0;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        hash =
          (
            (
              hash << 5
            ) -
            hash
          ) +
          text.charCodeAt(
            i
          );

        hash |= 0;

      }


      return hash;

    }


    function getBookColor(
      book,
      index
    ) {

      if (
        book.spineColor &&
        String(
          book.spineColor
        ).trim()
      ) {

        return book.spineColor;

      }


      const text =
        (
          book.title ||
          ""
        ) +
        (
          book.author ||
          ""
        ) +
        index;


      const colorIndex =
        Math.abs(
          hashString(
            text
          )
        ) %
        shelfColors.length;


      return shelfColors[
        colorIndex
      ];

    }


    function lightenColor(
      hex,
      amount
    ) {

      if (
        !hex ||
        !hex.startsWith(
          "#"
        ) ||
        hex.length !== 7
      ) {

        return hex;

      }


      let r =
        parseInt(
          hex.substring(
            1,
            3
          ),
          16
        );

      let g =
        parseInt(
          hex.substring(
            3,
            5
          ),
          16
        );

      let b =
        parseInt(
          hex.substring(
            5,
            7
          ),
          16
        );


      r =
        Math.min(
          255,
          r + amount
        );

      g =
        Math.min(
          255,
          g + amount
        );

      b =
        Math.min(
          255,
          b + amount
        );


      return (
        "#" +
        r
          .toString(16)
          .padStart(
            2,
            "0"
          ) +
        g
          .toString(16)
          .padStart(
            2,
            "0"
          ) +
        b
          .toString(16)
          .padStart(
            2,
            "0"
          )
      );

    }


    function isLightColor(
      hex
    ) {

      if (
        !hex ||
        !hex.startsWith(
          "#"
        ) ||
        hex.length !== 7
      ) {

        return false;

      }


      const r =
        parseInt(
          hex.substring(
            1,
            3
          ),
          16
        );

      const g =
        parseInt(
          hex.substring(
            3,
            5
          ),
          16
        );

      const b =
        parseInt(
          hex.substring(
            5,
            7
          ),
          16
        );


      const brightness =
        (
          r * 299 +
          g * 587 +
          b * 114
        ) /
        1000;


      return brightness >
        165;

    }

    function applyCoverTextContrast(
      image,
      spine
    ) {

      try {

        const canvas =
          document.createElement(
            "canvas"
          );

        const context =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );

        if (!context) {
          return;
        }


        canvas.width = 24;
        canvas.height = 60;


        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const imageData =
          context.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          ).data;


        let totalLuminance = 0;

let totalRed = 0;
let totalGreen = 0;
let totalBlue = 0;

let count = 0;

const paletteBuckets =
  new Map();
        
        for (
          let i = 0;
          i < imageData.length;
          i += 16
        ) {

          const r = imageData[i];
const g = imageData[i + 1];
const b = imageData[i + 2];

const luminance =
  (0.2126 * r) +
  (0.7152 * g) +
  (0.0722 * b);

if (
  luminance > 35 &&
  luminance < 225
) {
  totalLuminance += luminance;

  totalRed += r;
  totalGreen += g;
  totalBlue += b;

  count += 1;
  const quantizedRed =
  Math.round(
    r / 32
  ) * 32;

const quantizedGreen =
  Math.round(
    g / 32
  ) * 32;

const quantizedBlue =
  Math.round(
    b / 32
  ) * 32;

const paletteKey =
  `${quantizedRed},${quantizedGreen},${quantizedBlue}`;

const paletteEntry =
  paletteBuckets.get(
    paletteKey
  ) || {
    count: 0,
    red: 0,
    green: 0,
    blue: 0
  };

paletteEntry.count += 1;
paletteEntry.red += r;
paletteEntry.green += g;
paletteEntry.blue += b;

paletteBuckets.set(
  paletteKey,
  paletteEntry
);
}

        }

const palette =
  Array.from(
    paletteBuckets.values()
  )
    .sort(
      (a, b) =>
        b.count - a.count
    )
    .slice(
      0,
      8
    )
    .map(
      entry => ({
        red:
          Math.round(
            entry.red /
            entry.count
          ),

        green:
          Math.round(
            entry.green /
            entry.count
          ),

        blue:
          Math.round(
            entry.blue /
            entry.count
          ),

        count:
          entry.count
      })
    );


const basePaletteColor =
  palette[0] || {
    red: 90,
    green: 70,
    blue: 60
  };


const accentPaletteColor =
  palette.find(
    color => {

      const difference =
        Math.abs(
          color.red -
          basePaletteColor.red
        ) +
        Math.abs(
          color.green -
          basePaletteColor.green
        ) +
        Math.abs(
          color.blue -
          basePaletteColor.blue
        );

      return (
        difference > 85
      );

    }
  ) ||
  palette[1] ||
  basePaletteColor;


const secondaryPaletteColor =
  palette.find(
    color => {

      const baseDifference =
        Math.abs(
          color.red -
          basePaletteColor.red
        ) +
        Math.abs(
          color.green -
          basePaletteColor.green
        ) +
        Math.abs(
          color.blue -
          basePaletteColor.blue
        );

      const accentDifference =
        Math.abs(
          color.red -
          accentPaletteColor.red
        ) +
        Math.abs(
          color.green -
          accentPaletteColor.green
        ) +
        Math.abs(
          color.blue -
          accentPaletteColor.blue
        );

      return (
        baseDifference > 70 &&
        accentDifference > 60
      );

    }
  ) ||
  accentPaletteColor;
        
        const average =
          count
            ? totalLuminance / count
            : 128;

const averageRed =
  count
    ? Math.round(totalRed / count)
    : 90;

const averageGreen =
  count
    ? Math.round(totalGreen / count)
    : 70;

const averageBlue =
  count
    ? Math.round(totalBlue / count)
    : 60;

        const maxColor =
  Math.max(
    averageRed,
    averageGreen,
    averageBlue
  );

const minColor =
  Math.min(
    averageRed,
    averageGreen,
    averageBlue
  );

const colorSpread =
  maxColor - minColor;

        
const saturation =
  maxColor === 0
    ? 0
    : colorSpread / maxColor;

        const contrast =
  Math.abs(
    average - 128
  ) / 128;


let ornamentStyle =
  "classic";

if (
  saturation > 0.48 &&
  colorSpread > 70 &&
  contrast > 0.18
) {
  ornamentStyle =
    "bold";
} else if (
  average < 95 &&
  contrast > 0.22
) {
  ornamentStyle =
    "dark";
} else if (
  saturation > 0.34
) {
  ornamentStyle =
    "geometric";
} else if (
  average > 170 &&
  saturation < 0.24
) {
  ornamentStyle =
    "delicate";
}

spine.dataset.ornamentStyle =
  ornamentStyle;

       const seedText =
  (
    spine.querySelector(
      ".book-spine-title"
    )?.textContent ||
    ""
  ).toLowerCase();

let titleSeed =
  0;

for (
  let i = 0;
  i < seedText.length;
  i += 1
) {
  titleSeed =
    (
      titleSeed * 31 +
      seedText.charCodeAt(i)
    ) >>> 0;
}

const designSeed =
  Math.abs(
    Math.round(
      averageRed * 3 +
      averageGreen * 5 +
      averageBlue * 7 +
      average * 11 +
      titleSeed
    )
  );

const designVariant =
  designSeed % 4;

spine.dataset.designVariant =
  String(
    designVariant
  );

        const layoutVariant =
  Math.abs(
    designSeed +
    averageRed * 7 +
    averageBlue * 3
  ) % 5;

const motifVariant =
  Math.abs(
    designSeed +
    averageGreen * 11 +
    colorSpread * 5
  ) % 6;

const lineVariant =
  Math.abs(
    designSeed +
    Math.round(
      saturation * 100
    ) * 7
  ) % 4;

const decorationLevel =
  saturation > 0.42
    ? "rich"
    : contrast > 0.24
      ? "medium"
      : "minimal";

spine.dataset.layoutVariant =
  String(
    Math.floor(
      layoutVariant
    )
  );

spine.dataset.motifVariant =
  String(
    Math.floor(
      motifVariant
    )
  );

spine.dataset.lineVariant =
  String(
    Math.floor(
      lineVariant
    )
  );

spine.dataset.decorationLevel =
  decorationLevel;

const spineRed =
  Math.round(
    (
      basePaletteColor.red * 0.84
    ) +
    (
      secondaryPaletteColor.red * 0.16
    )
  );

const spineGreen =
  Math.round(
    (
      basePaletteColor.green * 0.84
    ) +
    (
      secondaryPaletteColor.green * 0.16
    )
  );

const spineBlue =
  Math.round(
    (
      basePaletteColor.blue * 0.84
    ) +
    (
      secondaryPaletteColor.blue * 0.16
    )
  );


spine.style.background =
  `
  linear-gradient(
    90deg,
    rgb(
      ${Math.max(spineRed - 22, 0)},
      ${Math.max(spineGreen - 22, 0)},
      ${Math.max(spineBlue - 22, 0)}
    ) 0%,

    function ensureEnoughShelves() {

      const bookshelf =
        document.getElementById(
          "bookshelf"
        );

      const decorationLayer =
        document.getElementById(
          "decorationLayer"
        );

      const needed =
        Math.max(
          4,
          Math.ceil(
            displayedBooks.length /
            getBooksPerShelf()
          )
        );


      let rows =
        getShelfRows();


      while (
        rows.length <
        needed
      ) {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "shelf-row";

        row.dataset.shelf =
          rows.length;


        bookshelf.insertBefore(
          row,
          decorationLayer
        );


        rows =
          getShelfRows();

      }


      while (
        rows.length >
        needed &&
        rows.length >
        4
      ) {

        rows[
          rows.length -
          1
        ].remove();


        rows =
          getShelfRows();

      }

    }

    function addBookPointerEvents(
      element,
      book
    ) {

      let holdTimer =
        null;


      let dragging =
        false;


      let pointerId =
        null;


      element.addEventListener(
        "pointerdown",
        event => {

          pointerId =
            event.pointerId;


          dragStartX =
            event.clientX;


          dragStartY =
            event.clientY;


          movedDuringDrag =
            false;


          holdTimer =
            setTimeout(
              () => {

                if (
                  currentSort !==
                  "manual"
                ) {

                  return;

                }


                dragging =
                  true;


                draggingBookId =
                  book.id;


                element.classList.add(
                  "dragging"
                );


                document.getElementById(
                  "moveHint"
                ).classList.add(
                  "visible"
                );


                try {

                  element.setPointerCapture(
                    pointerId
                  );

                } catch (
                  error
                ) {}

              },
              260
            );

        }
      );


      element.addEventListener(
        "pointermove",
        event => {

          const distance =
            Math.hypot(
              event.clientX -
              dragStartX,

              event.clientY -
              dragStartY
            );


          if (
            distance >
            7
          ) {

            movedDuringDrag =
              true;

          }


          if (
            !dragging
          ) {

            if (
              distance >
              10
            ) {

              clearTimeout(
                holdTimer
              );

            }


            return;

          }


          event.preventDefault();


          highlightShelfAtPoint(
            event.clientX,
            event.clientY
          );

        }
      );


      element.addEventListener(
        "pointerup",
        async event => {

          clearTimeout(
            holdTimer
          );


          if (
            dragging
          ) {

            dragging =
              false;


            element.classList.remove(
              "dragging"
            );


            document.getElementById(
              "moveHint"
            ).classList.remove(
              "visible"
            );


            removeShelfHighlights();


            await moveBookToPoint(
              book.id,
              event.clientX,
              event.clientY
            );


            draggingBookId =
              null;


            return;

          }


          if (
            !movedDuringDrag
          ) {

            openBookDialog(
              book
            );

          }

        }
      );


      element.addEventListener(
        "pointercancel",
        () => {

          clearTimeout(
            holdTimer
          );


          dragging =
            false;


          draggingBookId =
            null;


          element.classList.remove(
            "dragging"
          );


          document.getElementById(
            "moveHint"
          ).classList.remove(
            "visible"
          );


          removeShelfHighlights();

        }
      );

    }


    function getShelfAtPoint(
      x,
      y
    ) {

      const rows =
        getShelfRows();


      return rows.find(
        row => {

          const rect =
            row.getBoundingClientRect();


          return (
            x >=
            rect.left &&

            x <=
            rect.right &&

            y >=
            rect.top &&

            y <=
            rect.bottom
          );

        }
      );

    }


    function highlightShelfAtPoint(
      x,
      y
    ) {

      removeShelfHighlights();


      const row =
        getShelfAtPoint(
          x,
          y
        );


      if (
        row
      ) {

        row.classList.add(
          "shelf-drop-highlight"
        );

      }

    }


    function removeShelfHighlights() {

      document.querySelectorAll(
        ".shelf-drop-highlight"
      ).forEach(
        element => {

          element.classList.remove(
            "shelf-drop-highlight"
          );

        }
      );

    }


    async function moveBookToPoint(
      bookId,
      x,
      y
    ) {

      if (
        currentSort !==
        "manual"
      ) {

        return;

      }


      const row =
        getShelfAtPoint(
          x,
          y
        );


      if (
        !row
      ) {

        return;

      }


      const shelfIndex =
        Number(
          row.dataset.shelf ||
          0
        );


      const perShelf =
        getBooksPerShelf();


      const booksInRow =
        [
          ...row.querySelectorAll(
            "[data-book-id]"
          )
        ];


      let positionInShelf =
        booksInRow.length;


      for (
        let i = 0;
        i <
        booksInRow.length;
        i++
      ) {

        const rect =
          booksInRow[
            i
          ].getBoundingClientRect();


        if (
          x <
          rect.left +
          rect.width /
          2
        ) {

          positionInShelf =
            i;

          break;

        }

      }


      let targetIndex =
        shelfIndex *
        perShelf +
        positionInShelf;


      const manualBooks =
        [
          ...displayedBooks
        ];


      const oldIndex =
        manualBooks.findIndex(
          book =>
            book.id ===
            bookId
        );


      if (
        oldIndex ===
        -1
      ) {

        return;

      }


      const [
        movedBook
      ] =
        manualBooks.splice(
          oldIndex,
          1
        );


      if (
        targetIndex >
        oldIndex
      ) {

        targetIndex--;

      }


      targetIndex =
        Math.max(
          0,
          Math.min(
            targetIndex,
            manualBooks.length
          )
        );


      manualBooks.splice(
        targetIndex,
        0,
        movedBook
      );


      for (
        let i = 0;
        i <
        manualBooks.length;
        i++
      ) {

        manualBooks[
          i
        ].sortOrder =
          i + 1;


        manualBooks[
          i
        ].updatedAt =
          new Date()
            .toISOString();


        await saveBook(
          manualBooks[
            i
          ]
        );

      }


      books =
        [
          ...manualBooks
        ];


      renderShelf();

    }

    function openBookDialog(

      const dialog =
        document.getElementById(
          "bookDialog"
        );


      const cover =
        document.getElementById(
          "dialogCover"
        );


      const title =
        document.getElementById(
          "dialogTitle"
        );


      const author =
        document.getElementById(
          "dialogAuthor"
        );


      const stars =
        document.getElementById(
          "dialogStars"
        );


      const info =
        document.getElementById(
          "dialogInfo"
        );


      const notes =
        document.getElementById(
          "dialogNotes"
        );


      title.textContent =
        book.title ||
        "Ohne Titel";


      author.textContent =
        book.author ||
        "Unbekannter Autor";


      if (
        book.cover
      ) {

        cover.src =
          book.cover;


        cover.style.display =
          "block";

      } else {

        cover.removeAttribute(
          "src"
        );


        cover.style.display =
          "none";

      }


      stars.textContent =
        createStarText(
          Number(
            book.rating ||
            0
          )
        );


      info.innerHTML =
        "";


      const details = [

        [
          "Status",
          book.status
        ],

        [
          "Bewertung",
          book.rating
            ?
            book.rating +
            " / 5"
            :
            ""
        ],

        [
          "Sprache",
          book.language
        ],

        [
          "Seiten",
          book.pages
        ],

        [
          "Jahr",
          book.year
        ],

        [
          "ISBN",
          book.isbn
        ],

        [
          "Genre",
          book.genre
        ],

        [
          "Format",
          book.format
        ],

        [
          "Reihe",
          book.series
        ],

        [
          "Band",
          book.volume
        ]

      ];


      details.forEach(
        (
          [
            label,
            value
          ]
        ) => {

          if (
            value ===
            "" ||

            value ===
            null ||

            value ===
            undefined
          ) {

            return;

          }


          const row =
            document.createElement(
              "div"
            );


          const strong =
            document.createElement(
              "strong"
            );


          strong.textContent =
            label +
            ": ";


          row.appendChild(
            strong
          );


          row.appendChild(
            document.createTextNode(
              String(
                value
              )
            )
          );


          info.appendChild(
            row
          );

        }
      );


      if (
        book.notes &&
        String(
          book.notes
        ).trim()
      ) {

        notes.textContent =
          book.notes;


        notes.style.display =
          "block";

      } else {

        notes.style.display =
          "none";

      }


      dialog.showModal();

    }


    function createStarText(
      rating
    ) {

      if (
        rating <=
        0
      ) {

        return "☆☆☆☆☆";

      }


      let result =
        "";


      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        if (
          rating >=
          i
        ) {

          result +=
            "★";

        } else if (
          rating >=
          i - 0.5
        ) {

          result +=
            "◐";

        } else {

          result +=
            "☆";

        }

      }


      return result;

    }


    document.getElementById(
      "closeDialog"
    ).addEventListener(
      "click",
      () => {

        document.getElementById(
          "bookDialog"
        ).close();

      }
    );


    document.getElementById(
      "bookDialog"
    ).addEventListener(
      "click",
      event => {

        if (
          event.target ===
          event.currentTarget
        ) {

          event.currentTarget.close();

        }

      }
    );


    /* =========================================================
       DEKORATIONEN
       ========================================================= */

    const decorationOptions = [

      "🪴",
      "🌿",
      "🌵",
      "🌷",
      "🌻",
      "🍄",

      "🕯️",
      "🏮",
      "💡",
      "✨",
      "🌙",
      "⭐",

      "☕",
      "🫖",
      "🍵",
      "🥐",
      "🍪",
      "🧁",

      "🐈",
      "🦋",
      "🐌",
      "🦉",
      "🐝",
      "🐇",

      "🖼️",
      "🏺",
      "🧸",
      "🎃",
      "🔮",
      "🪶"

    ];


    function loadDecorations() {

      try {

        const raw =
          localStorage.getItem(
            "bookshelfDecorations"
          );


        if (
          !raw
        ) {

          return [];

        }


        const parsed =
          JSON.parse(
            raw
          );


        return Array.isArray(
          parsed
        )
          ?
          parsed
          :
          [];

      } catch (
        error
      ) {

        return [];

      }

    }


    function saveDecorations(
      decorations
    ) {

      localStorage.setItem(
        "bookshelfDecorations",
        JSON.stringify(
          decorations
        )
      );

    }


    function createDecorationMenu() {

      const grid =
        document.getElementById(
          "decoGrid"
        );


      grid.innerHTML =
        "";


      decorationOptions.forEach(
        emoji => {

          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "deco-option";


          button.textContent =
            emoji;


          button.addEventListener(
            "click",
            () => {

              addDecoration(
                emoji
              );

            }
          );


          grid.appendChild(
            button
          );

        }
      );

    }


    function addDecoration(
      emoji
    ) {

      const decorations =
        loadDecorations();


      decorations.push(
        {

          id:
            crypto.randomUUID(),

          emoji:
            emoji,

          x:
            50,

          y:
            10 +
            (
              decorations.length *
              7
            ) %
            70

        }
      );


      saveDecorations(
        decorations
      );


      renderDecorations();

    }


    function renderDecorations() {

      const layer =
        document.getElementById(
          "decorationLayer"
        );


      layer.innerHTML =
        "";


      const decorations =
        loadDecorations();


      decorations.forEach(
        decoration => {

          const element =
            document.createElement(
              "div"
            );


          element.className =
            "decoration";


          if (
            decoration.id ===
            selectedDecorationId
          ) {

            element.classList.add(
              "selected"
            );

          }


          element.dataset.decorationId =
            decoration.id;


          element.textContent =
            decoration.emoji;


          element.style.left =
            decoration.x +
            "%";


          element.style.top =
            decoration.y +
            "%";


          addDecorationEvents(
            element,
            decoration
          );


          layer.appendChild(
            element
          );

        }
      );


      updateDecorationDeleteButton();

    }


    function addDecorationEvents(
      element,
      decoration
    ) {

      let dragging =
        false;


      let startPointerX =
        0;


      let startPointerY =
        0;


      let startX =
        decoration.x;


      let startY =
        decoration.y;


      element.addEventListener(
        "pointerdown",
        event => {

          event.preventDefault();


          dragging =
            true;


          selectedDecorationId =
            decoration.id;


          startPointerX =
            event.clientX;


          startPointerY =
            event.clientY;


          startX =
            decoration.x;


          startY =
            decoration.y;


          try {

            element.setPointerCapture(
              event.pointerId
            );

          } catch (
            error
          ) {}


          renderDecorationSelection();

        }
      );


      element.addEventListener(
        "pointermove",
        event => {

          if (
            !dragging
          ) {

            return;

          }


          event.preventDefault();


          const bookshelf =
            document.getElementById(
              "bookshelf"
            );


          const rect =
            bookshelf.getBoundingClientRect();


          const deltaX =
            (
              event.clientX -
              startPointerX
            ) /
            rect.width *
            100;


          const deltaY =
            (
              event.clientY -
              startPointerY
            ) /
            rect.height *
            100;


          decoration.x =
            Math.max(
              0,
              Math.min(
                92,
                startX +
                deltaX
              )
            );


          decoration.y =
            Math.max(
              0,
              Math.min(
                94,
                startY +
                deltaY
              )
            );


          element.style.left =
            decoration.x +
            "%";


          element.style.top =
            decoration.y +
            "%";

        }
      );


      element.addEventListener(
        "pointerup",
        () => {

          if (
            !dragging
          ) {

            return;

          }


          dragging =
            false;


          const decorations =
            loadDecorations();


          const index =
            decorations.findIndex(
              item =>
                item.id ===
                decoration.id
            );


          if (
            index !==
            -1
          ) {

            decorations[
              index
            ] =
              decoration;


            saveDecorations(
              decorations
            );

          }


          renderDecorationSelection();

        }
      );

    }


    function renderDecorationSelection() {

      document.querySelectorAll(
        ".decoration"
      ).forEach(
        element => {

          element.classList.toggle(
            "selected",
            element.dataset.decorationId ===
            selectedDecorationId
          );

        }
      );


      updateDecorationDeleteButton();

    }


    function updateDecorationDeleteButton() {

      const button =
        document.getElementById(
          "deleteDecorationButton"
        );


      button.classList.toggle(
        "visible",
        Boolean(
          selectedDecorationId
        )
      );

    }


    document.getElementById(
      "deleteDecorationButton"
    ).addEventListener(
      "click",
      () => {

        if (
          !selectedDecorationId
        ) {

          return;

        }


        let decorations =
          loadDecorations();


        decorations =
          decorations.filter(
            decoration =>
              decoration.id !==
              selectedDecorationId
          );


        saveDecorations(
          decorations
        );


        selectedDecorationId =
          null;


        renderDecorations();

      }
    );


    document.getElementById(
      "decoButton"
    ).addEventListener(
      "click",
      () => {

        document.getElementById(
          "decoPanel"
        ).classList.toggle(
          "open"
        );

      }
    );


    /* =========================================================
       START
       ========================================================= */

    async function initializeShelf() {

      books =
        await getAllBooks();


      createDecorationMenu();


      renderShelf();

    }


    window.addEventListener(
      "resize",
      () => {

        renderShelf();

      }
    );


    initializeShelf()
      .catch(
        error => {

          console.error(
            "Das Bücherregal konnte nicht geladen werden:",
            error
          );

        }
      );

  </script>
