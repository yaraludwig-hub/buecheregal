<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buch hinzufügen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6efe6;
      color: #3d3028;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #6f5544;
      text-decoration: none;
      font-size: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #806f62;
    }

    .form-card {
      background: #fffaf4;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 8px 22px rgba(76, 52, 37, 0.08);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #dfd0c3;
      border-radius: 14px;
      padding: 13px 14px;
      background: #ffffff;
      color: #3d3028;
      font: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .save-button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 15px;
      background: #b88f6d;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    .save-button:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 7px;
      color: #948275;
      font-size: 13px;
    }
.star-rating {
  display: flex;
  gap: 3px;
  margin-top: 5px;
}

.star {
  position: relative;
  width: 32px;
  height: 34px;
  border: none;
  background: transparent;
  padding: 0;
  font-size: 32px;
  line-height: 34px;
  color: #d8c8bb;
  cursor: pointer;
}

.star::before {
  content: "★";
}

.star.full {
  color: #b88f6d;
}

.star.half {
  color: #d8c8bb;
}

.star.half::after {
  content: "★";
  position: absolute;
  left: 0;
  top: 0;
  width: 50%;
  overflow: hidden;
  color: #b88f6d;
  white-space: nowrap;
}

.rating-text {
  margin-top: 7px;
  color: #948275;
  font-size: 13px;
}
  </style>
</head>

<body>
  <main class="app">

    <a class="back" href="index.html">← Zurück zur Startseite</a>

    <h1>Buch hinzufügen</h1>
    <p class="subtitle">
      Füge erstmal ein Buch manuell zu deiner Sammlung hinzu.
    </p>

    <form class="form-card">

      <div class="field">
        <label for="title">Titel</label>
        <input id="title" type="text" placeholder="z. B. Fourth Wing">
      </div>

      <div class="field">
        <label for="author">Autor/in</label>
        <input id="author" type="text" placeholder="z. B. Rebecca Yarros">
      </div>

      <div class="two-columns">

        <div class="field">
          <label for="language">Sprache</label>
          <select id="language">
            <option>Deutsch</option>
            <option>Englisch</option>
          </select>
        </div>

        <div class="field">
          <label for="pages">Seiten</label>
          <input id="pages" type="number" placeholder="432">
        </div>

      </div>

      <div class="two-columns">

        <div class="field">
          <label for="status">Lesestatus</label>
          <select id="status">
            <option>Ungelesen</option>
            <option>Lese ich gerade</option>
            <option>Gelesen</option>
            <option>Abgebrochen</option>
          </select>
        </div>

     <div class="field">
  <label>Bewertung</label>

  <div class="star-rating" id="starRating">
    <button type="button" class="star" data-value="1"></button>
<button type="button" class="star" data-value="2"></button>
<button type="button" class="star" data-value="3"></button>
<button type="button" class="star" data-value="4"></button>
<button type="button" class="star" data-value="5"></button>
  </div>

  <div class="rating-text" id="ratingText">
    Keine Bewertung
  </div>

  <input type="hidden" id="rating" value="">
</div>

      </div>

      <div class="field">
        <label for="format">Format / Quelle</label>
        <select id="format">
          <option>Print</option>
          <option>Kindle</option>
          <option>Kindle Unlimited</option>
          <option>Hörbuch</option>
        </select>
      </div>

      <div class="two-columns">

        <div class="field">
          <label for="series">Reihe</label>
          <input id="series" type="text" placeholder="z. B. The Empyrean">
        </div>

        <div class="field">
          <label for="volume">Band</label>
          <input id="volume" type="number" placeholder="1">
        </div>

      </div>

      <div class="field">
        <label for="cover">Cover-URL</label>
        <input id="cover" type="url" placeholder="https://...">
        <div class="hint">
          Später kommt hier zusätzlich eine richtige Bildauswahl dazu.
        </div>
      </div>

      <div class="field">
        <label for="notes">Persönliche Notizen</label>
        <textarea id="notes" placeholder="Was möchtest du zu dem Buch festhalten?"></textarea>
      </div>

      <button class="save-button" type="button">
        Buch speichern
      </button>

    </form>

  </main>
  <script>
  const stars = document.querySelectorAll(".star");
  const ratingInput = document.getElementById("rating");
  const ratingText = document.getElementById("ratingText");

  let currentRating = 0;

  stars.forEach((star) => {
    star.addEventListener("click", (event) => {
      const rect = star.getBoundingClientRect();
      const clickPosition = event.clientX - rect.left;
      const starValue = Number(star.dataset.value);

      if (clickPosition < rect.width / 2) {
        currentRating = starValue - 0.5;
      } else {
        currentRating = starValue;
      }

      ratingInput.value = currentRating;
      ratingText.textContent = currentRating + " von 5 Sternen";

      updateStars();
    });
  });

  function updateStars() {
    stars.forEach((star) => {
      const starValue = Number(star.dataset.value);

      star.classList.remove("full", "half");

      if (currentRating >= starValue) {
        star.classList.add("full");
      } else if (currentRating === starValue - 0.5) {
        star.classList.add("half");
      }
    });
  }
</script>
</body>
</html>
