<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buch hinzufügen</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <a class="back" href="index.html">
      ← Zurück zur Startseite
    </a>

    <header class="page-header">
      <h1>Buch hinzufügen</h1>
      <p class="page-subtitle">
        Füge ein Buch zu deiner Sammlung hinzu.
      </p>
    </header>

    <form class="card" style="padding: 22px;" id="bookForm">

      <div class="field">
        <label for="title">Titel</label>

        <input
          id="title"
          type="text"
          placeholder="z. B. Fourth Wing"
          required
        >
      </div>

      <div class="field">
        <label for="author">Autor/in</label>

        <input
          id="author"
          type="text"
          placeholder="z. B. Rebecca Yarros"
          required
        >
      </div>

      <div class="two-columns">

        <div class="field">

          <label for="language">
            Sprache
          </label>

          <select id="language">
            <option>Deutsch</option>
            <option>Englisch</option>
          </select>

        </div>

        <div class="field">

          <label for="pages">
            Seiten
          </label>

          <input
            id="pages"
            type="number"
            min="1"
            placeholder="432"
          >

        </div>

      </div>

      <div class="two-columns">

        <div class="field">

          <label for="status">
            Lesestatus
          </label>

          <select id="status">
            <option>Ungelesen</option>
            <option>Lese ich gerade</option>
            <option>Gelesen</option>
            <option>Abgebrochen</option>
          </select>

        </div>

        <div class="field">

          <label for="format">
            Format / Quelle
          </label>

          <select id="format">
            <option>Print</option>
            <option>Kindle</option>
            <option>Kindle Unlimited</option>
            <option>Hörbuch</option>
          </select>

        </div>

      </div>

      <div class="field">

        <label>
          Bewertung
        </label>

        <div
          class="star-rating"
          id="starRating"
        >

          <button
            type="button"
            class="star"
            data-value="1"
            aria-label="1 Stern"
          ></button>

          <button
            type="button"
            class="star"
            data-value="2"
            aria-label="2 Sterne"
          ></button>

          <button
            type="button"
            class="star"
            data-value="3"
            aria-label="3 Sterne"
          ></button>

          <button
            type="button"
            class="star"
            data-value="4"
            aria-label="4 Sterne"
          ></button>

          <button
            type="button"
            class="star"
            data-value="5"
            aria-label="5 Sterne"
          ></button>

        </div>

        <div
          class="rating-text"
          id="ratingText"
        >
          Keine Bewertung
        </div>

        <button
          type="button"
          class="clear-rating"
          id="clearRating"
        >
          Bewertung entfernen
        </button>

        <input
          type="hidden"
          id="rating"
          value=""
        >

      </div>

      <div class="two-columns">

        <div class="field">

          <label for="series">
            Reihe
          </label>

          <input
            id="series"
            type="text"
            placeholder="z. B. The Empyrean"
          >

        </div>

        <div class="field">

          <label for="volume">
            Band
          </label>

          <input
            id="volume"
            type="number"
            min="1"
            step="1"
            placeholder="1"
          >

        </div>

      </div>

      <div class="field">

        <label for="cover">
          Cover-URL
        </label>

        <input
          id="cover"
          type="url"
          placeholder="https://..."
        >

        <div class="hint">
          Die automatische Buch- und Coversuche bauen wir als Nächstes ein.
        </div>

      </div>

      <div class="field">

        <label for="notes">
          Persönliche Notizen
        </label>

        <textarea
          id="notes"
          placeholder="Was möchtest du zu diesem Buch festhalten?"
        ></textarea>

      </div>

      <button
        class="save-button"
        id="saveButton"
        type="submit"
      >
        Buch speichern
      </button>

    </form>

  </main>


  <script>

    const stars =
      document.querySelectorAll(".star");

    const ratingInput =
      document.getElementById("rating");

    const ratingText =
      document.getElementById("ratingText");

    let currentRating = 0;


    stars.forEach((star) => {

      star.addEventListener(
        "click",
        function(event) {

          const rect =
            star.getBoundingClientRect();

          const clickPosition =
            event.clientX - rect.left;

          const starValue =
            Number(star.dataset.value);


          if (
            clickPosition <
            rect.width / 2
          ) {

            currentRating =
              starValue - 0.5;

          } else {

            currentRating =
              starValue;

          }


          updateStars();

        }
      );

    });


    function updateStars() {

      ratingInput.value =
        currentRating || "";


      ratingText.textContent =
        currentRating
          ? currentRating +
            " von 5 Sternen"
          : "Keine Bewertung";


      stars.forEach((star) => {

        const starValue =
          Number(star.dataset.value);


        star.classList.remove(
          "full",
          "half"
        );


        if (
          currentRating >=
          starValue
        ) {

          star.classList.add(
            "full"
          );

        } else if (
          currentRating ===
          starValue - 0.5
        ) {

          star.classList.add(
            "half"
          );

        }

      });

    }


    document
      .getElementById("clearRating")
      .addEventListener(
        "click",
        function() {

          currentRating = 0;

          updateStars();

        }
      );


    function openDatabase() {

      return new Promise(
        (resolve, reject) => {

          const request =
            indexedDB.open(
              "buecherregalDB",
              1
            );


          request.onupgradeneeded =
            function(event) {

              const db =
                event.target.result;


              if (
                !db.objectStoreNames
                  .contains("books")
              ) {

                db.createObjectStore(
                  "books",
                  {
                    keyPath: "id"
                  }
                );

              }

            };


          request.onsuccess =
            function(event) {

              resolve(
                event.target.result
              );

            };


          request.onerror =
            function() {

              reject(
                new Error(
                  "Die Datenbank konnte nicht geöffnet werden."
                )
              );

            };

        }
      );

    }


    document
      .getElementById("bookForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const title =
            document
              .getElementById("title")
              .value
              .trim();

          const author =
            document
              .getElementById("author")
              .value
              .trim();


          if (!title) {

            alert(
              "Bitte gib einen Buchtitel ein."
            );

            return;

          }


          if (!author) {

            alert(
              "Bitte gib eine Autorin oder einen Autor ein."
            );

            return;

          }


          const book = {

            id:
              crypto.randomUUID(),

            title: title,

            author: author,

            language:
              document.getElementById(
                "language"
              ).value,

            pages:
              Number(
                document.getElementById(
                  "pages"
                ).value
              ) || null,

            status:
              document.getElementById(
                "status"
              ).value,

            rating:
              currentRating || null,

            format:
              document.getElementById(
                "format"
              ).value,

            series:
              document
                .getElementById(
                  "series"
                )
                .value
                .trim(),

            volume:
              Number(
                document.getElementById(
                  "volume"
                ).value
              ) || null,

            cover:
              document
                .getElementById(
                  "cover"
                )
                .value
                .trim(),

            notes:
              document
                .getElementById(
                  "notes"
                )
                .value
                .trim(),

            createdAt:
              new Date()
                .toISOString()

          };


          try {

            const db =
              await openDatabase();

            const transaction =
              db.transaction(
                "books",
                "readwrite"
              );

            const store =
              transaction
                .objectStore(
                  "books"
                );

            store.add(book);


            transaction.oncomplete =
              function() {

                alert(
                  "Buch wurde gespeichert."
                );


                window.location.href =
                  "bibliothek.html";

              };


            transaction.onerror =
              function() {

                alert(
                  "Beim Speichern ist etwas schiefgelaufen."
                );

              };


          } catch (error) {

            console.error(error);

            alert(
              "Das Buch konnte nicht gespeichert werden."
            );

          }

        }
      );

  </script>

</body>
</html>
